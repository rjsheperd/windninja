<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>WindNinja Browser Solver</title>
<style>
  :root { --bg: #fafaf8; --fg: #1d1d1b; --muted: #6b6b66; --line: #d8d8d2; --accent: #2f6db5; }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #161615; --fg: #ececea; --muted: #a2a29b; --line: #34342f; --accent: #7aa9e6; }
  }
  body { margin: 0; padding: 16px; background: var(--bg); color: var(--fg);
         font: 14px/1.45 system-ui, sans-serif; }
  main { max-width: 820px; margin: 0 auto; }
  h1 { font-size: 20px; margin: 0 0 4px; }
  p.sub { margin: 0 0 16px; color: var(--muted); }
  fieldset { border: 1px solid var(--line); border-radius: 6px; margin: 0 0 12px; }
  label { margin-right: 12px; white-space: nowrap; }
  input[type=number] { width: 6em; }
  button { padding: 4px 12px; }
  #status { color: var(--muted); }
  canvas { max-width: 100%; image-rendering: pixelated; border: 1px solid var(--line); }
  .legend { display: flex; align-items: center; gap: 8px; color: var(--muted); }
  .ramp { width: 160px; height: 10px; background: linear-gradient(90deg, #2b5ea8, #3fa8a0, #e9d35a, #e2763a, #b52a2a); }
  details pre { max-height: 220px; overflow: auto; font-size: 12px; }
</style>
</head>
<body>
<main>
<h1>WindNinja browser solver</h1>
<p class="sub">The momentum (RANS) solver on WebGPU, compiled to WebAssembly. The page
loads the DEM; the GPU solves; the map shows the ground-cell wind speed.</p>

<fieldset>
  <legend>Terrain</legend>
  <label>ASCII grid DEM (.asc, metres) <input type="file" id="dem" accept=".asc,.txt"></label>
  <button id="hill">Use built-in hill</button>
</fieldset>
<fieldset>
  <legend>Wind</legend>
  <label>Speed (mph) <input type="number" id="speed" value="10" min="0" step="1"></label>
  <label>From (deg) <input type="number" id="dir" value="270" min="0" max="360" step="5"></label>
  <label>Roughness z0 (m) <input type="number" id="z0" value="0.01" min="0.0001" step="0.01"></label>
  <label>Max steps <input type="number" id="steps" value="20000" min="100" step="1000"></label>
  <button id="run" disabled>Solve</button>
</fieldset>
<p id="status">Running the self-test…</p>
<canvas id="map" width="1" height="1"></canvas>
<div class="legend"><span id="lo">0</span><div class="ramp"></div><span id="hi">–</span> mph at
  <span id="height">–</span></div>
<details><summary>Log</summary><pre id="out"></pre></details>
</main>

<script>
  // log and self-test result, as index.html (Emscripten's JS defines globals
  // named out and err)
  var harnessOut = document.getElementById('out');
  function show(line) {
    harnessOut.textContent += line + '\n';
    var m = /^RESULT (\w+)/.exec(line);
    if (m) {
      document.body.dataset.result = m[1];
      document.getElementById('status').textContent =
        'Self-test: ' + line.replace(/^RESULT /, '') + '. Load a DEM or use the built-in hill.';
      document.getElementById('run').disabled = m[1] !== 'PASS';
    }
  }
  var Module = {
    print: show,
    printErr: show,
    onAbort: function (what) { show('RESULT FAIL abort: ' + what); }
  };
  window.addEventListener('error', function (e) { show('RESULT FAIL ' + e.message); });
  window.addEventListener('unhandledrejection', function (e) { show('RESULT FAIL ' + e.reason); });
  if (!navigator.gpu) show('RESULT SKIP navigator.gpu is missing');

  var dem = null;   // {nCols, nRows, cellSize, z: Float64Array, row 0 north}

  function parseAsc(text) {
    var tokens = text.trim().split(/\s+/), header = {}, i = 0;
    while (i < tokens.length && /^[a-z_]+$/i.test(tokens[i])) {
      header[tokens[i].toLowerCase()] = parseFloat(tokens[i + 1]);
      i += 2;
    }
    var nCols = header.ncols, nRows = header.nrows;
    if (!nCols || !nRows || !header.cellsize) throw new Error('not an ASCII grid');
    var z = new Float64Array(nCols * nRows);
    for (var k = 0; k < z.length; k++) z[k] = parseFloat(tokens[i + k]);
    return {nCols: nCols, nRows: nRows, cellSize: header.cellsize, z: z};
  }

  function builtInHill() {
    var nCols = 80, nRows = 60, z = new Float64Array(nCols * nRows);
    for (var r = 0; r < nRows; r++)
      for (var c = 0; c < nCols; c++)
        z[r * nCols + c] = 1000 + 250 * Math.exp(-((c - 40) * (c - 40) + (r - 30) * (r - 30)) / 120);
    return {nCols: nCols, nRows: nRows, cellSize: 30, z: z};
  }

  document.getElementById('dem').addEventListener('change', function (e) {
    var file = e.target.files[0];
    if (!file) return;
    file.text().then(function (text) {
      dem = parseAsc(text);
      document.getElementById('status').textContent =
        'DEM ' + dem.nCols + ' × ' + dem.nRows + ' at ' + dem.cellSize + ' m. Press Solve.';
    }).catch(function (err) {
      document.getElementById('status').textContent = 'Could not read the DEM: ' + err.message;
    });
  });
  document.getElementById('hill').addEventListener('click', function () {
    dem = builtInHill();
    document.getElementById('status').textContent = 'Built-in hill, 80 × 60 at 30 m. Press Solve.';
  });

  function color(t) {
    var stops = [[43, 94, 168], [63, 168, 160], [233, 211, 90], [226, 118, 58], [181, 42, 42]];
    t = Math.max(0, Math.min(1, t)) * (stops.length - 1);
    var i = Math.min(Math.floor(t), stops.length - 2), f = t - i;
    return stops[i].map(function (a, j) { return Math.round(a + f * (stops[i + 1][j] - a)); });
  }

  function draw(speed, nCols, nRows) {
    var canvas = document.getElementById('map'), max = 0;
    for (var i = 0; i < speed.length; i++) max = Math.max(max, speed[i]);
    canvas.width = nCols;
    canvas.height = nRows;
    canvas.style.width = Math.min(820, nCols * 8) + 'px';
    var ctx = canvas.getContext('2d'), img = ctx.createImageData(nCols, nRows);
    for (var p = 0; p < speed.length; p++) {
      var rgb = color(speed[p] / max);
      img.data.set([rgb[0], rgb[1], rgb[2], 255], 4 * p);
    }
    ctx.putImageData(img, 0, 0);
    document.getElementById('hi').textContent = max.toFixed(1);
  }

  document.getElementById('run').addEventListener('click', async function () {
    if (!dem) dem = builtInHill();
    var n = dem.nCols * dem.nRows, bytes = 8 * n;
    var pz = Module._malloc(bytes), pu = Module._malloc(bytes),
        pv = Module._malloc(bytes), pk = Module._malloc(bytes);
    Module.HEAPF64.set(dem.z, pz / 8);
    var mph = 0.44704, button = this, t0 = performance.now();
    button.disabled = true;
    document.getElementById('status').textContent = 'Solving…';
    try {
      var status = await Module.ccall('windninja_solve', 'number',
        ['number', 'number', 'number', 'number', 'number', 'number', 'number', 'number',
         'number', 'number', 'number', 'number'],
        [dem.nCols, dem.nRows, dem.cellSize, pz,
         parseFloat(document.getElementById('speed').value) * mph, 6.096,
         parseFloat(document.getElementById('dir').value),
         parseFloat(document.getElementById('z0').value),
         parseInt(document.getElementById('steps').value, 10), pu, pv, pk],
        {async: true});
      if (status !== 0) {
        document.getElementById('status').textContent =
          ['', 'The solution diverged.', 'WebGPU is not available.', 'Error (see the log).'][status];
        return;
      }
      // HEAPF64 may have been replaced if memory grew
      var u = Module.HEAPF64.subarray(pu / 8, pu / 8 + n),
          v = Module.HEAPF64.subarray(pv / 8, pv / 8 + n), speed = new Float64Array(n);
      for (var i = 0; i < n; i++) speed[i] = Math.hypot(u[i], v[i]) / mph;
      draw(speed, dem.nCols, dem.nRows);
      document.getElementById('height').textContent = (dem.cellSize / 2) + ' m';
      document.getElementById('status').textContent = 'Solved in ' +
        ((performance.now() - t0) / 1000).toFixed(1) + ' s (' + dem.nCols + ' × ' + dem.nRows + ' × 20 cells).';
    } finally {
      [pz, pu, pv, pk].forEach(function (p) { Module._free(p); });
      button.disabled = false;
    }
  });
</script>
<script src="windninja_wasm.js"></script>
</body>
</html>
